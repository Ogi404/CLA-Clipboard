<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14191f">
<title>Execution 01 · Friday trio clipboard</title>
<style>
:root{color-scheme:dark;--bg:#13191f;--panel:#1d252d;--inside:#242e38;--stroke:#38444f;--ink:#f0f4f7;--muted:#a5b2c0;--f:#5dcaa2;--o:#f0a66d;--blue:#78aeea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.38 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{max-width:790px;margin:auto;padding:12px 12px 72px}
button,input,textarea,select{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:5px 2px 12px}h1{font-size:19px;letter-spacing:-.025em;margin:0;font-weight:720}h2{font-size:16px;margin:0}small,.quiet{font-size:12px;color:var(--muted)}.info{font-size:13px;color:var(--muted);line-height:1.5}
.date{background:var(--panel);border:1px solid var(--stroke);border-radius:8px;padding:9px 8px;color:var(--ink);max-width:145px;font-size:13px}
.nav,.seg{display:flex;gap:6px;flex-wrap:wrap}.nav{margin-bottom:10px}.nav>button{flex:1;min-width:85px}.seg button,.nav button{border:1px solid var(--stroke);background:var(--panel);color:var(--ink);border-radius:9px;padding:10px 12px;min-height:43px;font-size:14px;font-weight:650}
.seg button.on,.nav button.on{background:#305b80;border-color:#78aeea;color:white}
.bar{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:11px;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar .seg button{min-width:58px}.bar .seg.foci button{min-width:61px}.bar-label{font-size:12px;color:var(--muted);margin-right:3px}
.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:12px;margin-bottom:10px}
.context{display:flex;gap:10px;flex-direction:column}.context-top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.context strong{font-size:15px}.mini{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mini button{padding:9px 11px;min-height:42px}
summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:25px}details[open] summary{margin-bottom:9px}.metafields{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}input[type=text],textarea{width:100%;background:var(--inside);color:var(--ink);border:1px solid var(--stroke);border-radius:8px;padding:10px;min-height:44px;font-size:16px}textarea{min-height:60px;resize:vertical}
.choose{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.choose .seg{flex:1}.choose .seg button{flex:1}.choose small{min-width:72px}
.measure{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:12px;margin-bottom:10px}
.measure-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.measure-head b{font-size:15px}.undo{background:transparent;border:1px solid var(--stroke);border-radius:8px;color:var(--muted);padding:8px 12px;font-size:13px;min-height:35px}.undo:disabled{opacity:.34;cursor:default}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.actions button{min-height:54px;background:var(--inside);border:1px solid var(--stroke);border-radius:9px;color:var(--ink);font-size:15px;font-weight:650;padding:9px;line-height:1.23}.actions button.f{border-color:#3d826c;color:#b6f1db}.actions button.o{border-color:#9b6f54;color:#ffcfad}.actions button.neutral{color:var(--muted);font-size:13px;min-height:40px}.actions.threats button{min-height:46px;font-size:14px}
.actions button:active{filter:brightness(1.4);transform:scale(.985)}.history{margin-top:10px;display:flex;flex-direction:column;gap:5px;max-height:235px;overflow:auto;overscroll-behavior:contain}.event{border-radius:7px;padding:7px 9px;background:var(--inside);border-left:3px solid #5d6d7e;font-size:13px;display:flex;align-items:start;gap:8px}.event .num{font-size:11px;color:var(--muted);width:23px;flex:none;padding-top:2px}.event.f{border-color:var(--f)}.event.o{border-color:var(--o)}.empty{font-size:13px;color:#8493a1;padding:5px 2px}
.summary-strip{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 0}.summary-strip span{font-size:12px;color:var(--muted);background:var(--inside);border-radius:6px;padding:4px 8px}.summary-strip b{color:var(--ink)}
footer{display:flex;gap:7px;flex-wrap:wrap;padding:6px 2px}footer button{border:1px solid var(--stroke);background:var(--panel);color:var(--ink);border-radius:9px;padding:11px 15px;min-height:45px;font-weight:650}.primary{background:#305b80!important;border-color:#78aeea!important}.export{margin-top:10px}textarea.exportText{font:12px/1.4 ui-monospace,Consolas,monospace;min-height:160px}.notes{margin-top:8px}.footer-note{margin-top:12px;font-size:12px;color:var(--muted)}.short{font-size:12px;color:var(--muted);margin-bottom:7px}
@media(min-width:650px){.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.actions.threats{grid-template-columns:repeat(4,minmax(0,1fr))}.bar{flex-wrap:nowrap}}
@media(max-width:370px){#app{padding-inline:8px}.actions button{font-size:13px}.bar .seg button{padding:8px 9px;min-width:48px}.date{max-width:130px}}

/* Compact five-tab navigation and probe one-tap phase outcomes */
@media(max-width:450px){.nav>button{min-width:29%;padding:10px 5px;font-size:12px}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.actions button{min-height:48px;padding:8px 4px;font-size:13px}.measure{padding:10px}}
</style>
</head>
<body><div id="app"></div>
<script>
'use strict';
/* Execution 01 · Friday 2026-11-06. No external libraries or network requests. */
const SESSION={id:'execution01-friday-trio-probes-2026-11-06-v2',title:'Execution 01 · Friday',date:'2026-11-06',attire:'No-Gi'};
const GAMES=[
 {key:'W',short:'W · Probe',name:'Opening frozen probe',rounds:['W'],slots:['P1','P2'],probe:true,rule:'Frozen standing probe: unrestricted legal choices, submission only, no positional points. Restart standing after a submission. Follow two focal athletes. No experience bands.'},
 {key:'T',short:'1 · Chokes',name:'Triangle / arm-in guillotine',rounds:['R1','R2'],slots:['F1','F2'],rule:'Start from a live, unfinished triangle or arm-in guillotine. Attacker wins with triangle or arm-in guillotine submission. Defender wins with first valid positional score or any legal submission. Escape alone does not win. Winner stays; losing athlete coaches, previous coach enters. Restart from a live attacking relationship.'},
 {key:'G',short:'2 · Pull',name:'Guard pull → choke or score',rounds:['R1','R2'],slots:['F1','F2'],rule:'Start standing. No takedowns. Both may pull; whoever ends up on top must work from top. First valid positional score OR triangle/arm-in guillotine submission wins. Other taps stop safely without a win. Winner stays; loser coaches; previous coach enters. Restart standing.'},
 {key:'D',short:'3 · Dogfight',name:'Dogfight scramble',rounds:['R1','R2'],slots:['F1','F2'],rule:'Start from a live, contested dogfight. First valid positional score or any legal submission wins. Winner stays; loser coaches; previous coach enters. Restart in dogfight.'},
 {key:'X',short:'X · Probe',name:'Closing frozen probe',rounds:['X'],slots:['P1','P2'],probe:true,rule:'Exactly the same unrestricted standing, submission-only frozen probe as opening. Use the SAME P1 and P2 focal athletes and ideally the same opponents. No experience bands. Fatigue at the end may affect performance.'}
];
const KEY='matclip:'+SESSION.id;
const PROBE_ENTRIES=[['P','Pull'],['T','Takedown'],['O','Other'],['R','Opponent first'],['N','No entry'],['?','Unclear']];
const PROBE_RESPONSES=['A','D','H'];
const PROBE_CONSEQUENCES=['+','=','-'];
const ROUND_IDS=['R1','R2'];
let selected={game:'W',round:'W',slot:'P1',export:false};
function rosterKey(game,slot){return (game==='W'||game==='X'?'P':game)+'|'+slot}
function recordKey(game,round,slot){return game+'|'+round+'|'+slot}
function blankRecord(){return {events:[],role:'A',start:'triangle',side:'U',mate:'A',note:'',probeOpponent:''}}
function blankState(){const s={date:SESSION.date,rosters:{},records:{}};for(const g of GAMES){for(const slot of g.slots){const k=rosterKey(g.key,slot);if(!s.rosters[k])s.rosters[k]={focal:'',a:'',b:''};for(const round of g.rounds)s.records[recordKey(g.key,round,slot)]=blankRecord()}}return s}
let state=blankState(),saveTimer=null;
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(typeof p.date==='string')state.date=p.date;for(const k of Object.keys(state.rosters))if(p.rosters?.[k])for(const f of ['focal','a','b'])if(typeof p.rosters[k][f]==='string')state.rosters[k][f]=p.rosters[k][f];for(const k of Object.keys(state.records))if(p.records?.[k]){const pr=p.records[k],r=state.records[k];r.events=Array.isArray(pr.events)?pr.events.filter(x=>x&&typeof x==='object'):[];for(const f of ['role','start','side','mate','note','probeOpponent'])if(typeof pr[f]==='string')r[f]=pr[f]}}}catch(e){}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));const el=document.getElementById('status');if(el)el.textContent='Saved'}catch(e){const el=document.getElementById('status');if(el)el.textContent='Storage unavailable — export now'}},100)}
function flush(){clearTimeout(saveTimer);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function h(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function game(){return GAMES.find(g=>g.key===selected.game)}
function rec(){return state.records[recordKey(selected.game,selected.round,selected.slot)]}
function people(){return state.rosters[rosterKey(selected.game,selected.slot)]}
function isProbe(){return !!game().probe}
function setGame(g){flush();selected.game=g;selected.round=game().rounds[0];selected.slot=game().slots[0];render()}
function setRound(r){flush();selected.round=r;render()}
function setSlot(s){flush();selected.slot=s;render()}
function setDate(v){state.date=v;save()}
function setPerson(k,v){people()[k]=v;save()}
function setProbeOpponent(v){rec().probeOpponent=v;save()}
function setNote(v){rec().note=v;save()}
function setContext(key,val){rec()[key]=val;save();render()}
function opponentName(r=rec(),p=people(),probe=isProbe()){return probe?(r.probeOpponent.trim()||p.a.trim()||'Unnamed opponent'):(r.mate==='A'?(p.a||'Mate A'):(p.b||'Mate B'))}
function outcomeCount(r){return r.events.filter(e=>e.type==='outcome').length}
function exchangeNo(r){return outcomeCount(r)+1}
function logOutcome(winner,method){const r=rec();r.events.push({type:'outcome',winner,method,start:r.start,role:r.role,side:r.side,mate:r.mate,opponent:opponentName(),at:Date.now()});save();render()}
function triangleOutcome(actor,method){const r=rec();const winner=actor==='A'?(r.role==='A'?'F':'O'):(r.role==='D'?'F':'O');logOutcome(winner,method)}
function logThreat(actor,method){const r=rec();r.events.push({type:'threat',actor,method,mate:r.mate,opponent:opponentName(),at:Date.now()});save();render()}
function probeEntry(code){const r=rec();r.events.push({type:'entry',code,opponent:opponentName(),at:Date.now()});save();render()}
function probePhase(response,consequence){const r=rec();const last=r.events.length?r.events[r.events.length-1]:null;const entryLink=last?.type==='entry'?last.code:'';r.events.push({type:'phase',response,consequence,entryLink,opponent:opponentName(),at:Date.now()});save();render()}
function probeSubmission(actor){const r=rec();r.events.push({type:'submission',actor,opponent:opponentName(),at:Date.now()});save();render()}
function undo(category){const events=rec().events;for(let i=events.length-1;i>=0;i--){if(events[i].type===category){events.splice(i,1);save();render();return}}}
function button(text,action,kind=''){return `<button class="${kind}" onclick="${action}">${h(text)}</button>`}
function selections(options,field){const v=rec()[field];return `<div class="seg">${options.map(([code,label])=>`<button class="${v===code?'on':''}" onclick="setContext('${field}','${code}')">${h(label)}</button>`).join('')}</div>`}
function niceMethod(m){return ({triangle:'Triangle',guillotine:'Arm-in guillotine',points:'Positional score',other:'Other submission',neutral:'Neutral rotation',other_tap:'Other tap · no win'})[m]||m}
function eventList(type){const r=rec(),out=[];let exchange=1,index=0;for(const e of r.events){if(e.type===type){index++;let s='';if(type==='entry'){const item=PROBE_ENTRIES.find(x=>x[0]===e.code);s=`${e.code} · ${item?item[1]:e.code}`}
else if(type==='phase'){s=`${e.response}${e.consequence}${e.entryLink?' · after '+e.entryLink:''}`}
else if(type==='submission'){s=`${e.actor==='F'?'Focal':'Opponent'} submission`}
else if(type==='threat'){s=`${e.actor==='F'?'Focal':'Opponent'} · ${niceMethod(e.method)} · exchange ${exchange}`}
else if(type==='outcome'){const win=e.winner==='F'?'Focal wins':e.winner==='O'?'Opponent wins':'No winner';s=`${win} · ${niceMethod(e.method)}${selected.game==='T'?` · start ${e.start==='triangle'?'triangle':'guillotine'} · focal ${e.role==='A'?'attacker':'defender'}`:''}${selected.game==='D'?` · ${e.side==='U'?'underhook':'whizzer'}`:''} · vs ${e.opponent||'opponent'}`}
const clazz=e.winner==='F'||e.actor==='F'?'f':e.winner==='O'||e.actor==='O'?'o':'';
out.push(`<div class="event ${clazz}"><span class="num">${index}.</span><span>${h(s)}</span></div>`)}if(e.type==='outcome')exchange++}return out.length?out.join(''):'<div class="empty">No events</div>'}
function stats(){let f=0,o=0,n=0;for(const e of rec().events)if(e.type==='outcome'){if(e.winner==='F')f++;else if(e.winner==='O')o++;else n++}return `<div class="summary-strip"><span>Focal <b>${f}</b></span><span>Opponent <b>${o}</b></span><span>Neutral <b>${n}</b></span></div>`}
function measure(title,category,buttons,hint=''){return `<section class="measure"><div class="measure-head"><b>${h(title)}</b><button class="undo" onclick="undo('${category}')" ${rec().events.some(e=>e.type===category)?'':'disabled'}>↶ Undo</button></div>${hint?`<div class="short">${h(hint)}</div>`:''}<div class="actions ${category==='threat'?'threats':''}">${buttons}</div><div class="history">${eventList(category)}</div>${category==='outcome'?stats():''}</section>`}
function probeUI(){const p1=PROBE_ENTRIES.map(([c,label])=>button(`${c} · ${label}`,`probeEntry('${c}')`)).join('');const phase=PROBE_RESPONSES.flatMap(r=>PROBE_CONSEQUENCES.map(c=>button(r+c,`probePhase('${r}','${c}')`,c==='+'?'f':c==='-'?'o':''))).join('');return measure('Standing choice','entry',p1,'Frozen codes: P pull · T takedown · O other · R opponent first · N no entry.')+measure('Phase response + 10s consequence','phase',phase,'One tap records both. A advance/attack · D defend/recover · H hold. + focal benefit · = neutral · − opponent benefit.')+measure('Submissions','submission',[button('F · Submission',"probeSubmission('F')",'f'),button('O · Submission',"probeSubmission('O')",'o')].join(''),'Restart standing after submission; no positional scoring.');}
function triangleUI(){return `<div class="panel context"><div class="choose"><small>Focal role</small>${selections([['A','Attacker'],['D','Defender']],'role')}</div><div class="choose"><small>Start from</small>${selections([['triangle','Triangle'],['guillotine','Arm-in guillotine']],'start')}</div></div>`+measure('Decisive outcomes','outcome',[
 button('Attacker · Triangle',"triangleOutcome('A','triangle')",rec().role==='A'?'f':'o'),
 button('Attacker · Guillotine',"triangleOutcome('A','guillotine')",rec().role==='A'?'f':'o'),
 button('Defender · Points',"triangleOutcome('D','points')",rec().role==='D'?'f':'o'),
 button('Defender · Triangle',"triangleOutcome('D','triangle')",rec().role==='D'?'f':'o'),
 button('Defender · Guillotine',"triangleOutcome('D','guillotine')",rec().role==='D'?'f':'o'),
 button('Defender · Other sub',"triangleOutcome('D','other')",rec().role==='D'?'f':'o'),
 button('Neutral rotation',"logOutcome('','neutral')",'neutral')].join(''),'Escape alone is not a win. Focal role and starting relation change only when you tap them.');}
function pullUI(){return measure('Choke threats observed','threat',[
 button('F · Triangle',"logThreat('F','triangle')",'f'),button('F · Guillotine',"logThreat('F','guillotine')",'f'),
 button('O · Triangle',"logThreat('O','triangle')",'o'),button('O · Guillotine',"logThreat('O','guillotine')",'o')].join(''),'Optional one-tap observation: attack forced a recognisable defensive response.')+measure('First decisive outcome','outcome',[
 button('F · Points',"logOutcome('F','points')",'f'),button('O · Points',"logOutcome('O','points')",'o'),
 button('F · Triangle',"logOutcome('F','triangle')",'f'),button('O · Triangle',"logOutcome('O','triangle')",'o'),
 button('F · Guillotine',"logOutcome('F','guillotine')",'f'),button('O · Guillotine',"logOutcome('O','guillotine')",'o'),
 button('Other tap · no win',"logOutcome('','other_tap')",'neutral'),button('Neutral rotation',"logOutcome('','neutral')",'neutral')].join(''),'Points are full wins. Only triangle/arm-in guillotine submissions are submission wins.');}
function dogUI(){return `<div class="panel context"><div class="choose"><small>Focal side</small>${selections([['U','Underhook'],['W','Whizzer']],'side')}</div></div>`+measure('First decisive outcome','outcome',[
 button('F · Points',"logOutcome('F','points')",'f'),button('O · Points',"logOutcome('O','points')",'o'),
 button('F · Submission',"logOutcome('F','other')",'f'),button('O · Submission',"logOutcome('O','other')",'o'),
 button('Neutral rotation',"logOutcome('','neutral')",'neutral')].join(''),'Any legal submission or first valid positional score wins.');}
function identity(){const p=people(),r=rec();if(isProbe()){const isOverride=!!r.probeOpponent.trim();return `<section class="panel context"><div class="context-top"><strong>${h(selected.slot)} · ${h(p.focal||'Focal unnamed')}</strong><span class="quiet">vs ${h(opponentName())}</span></div><details ${p.focal&&p.a?'':'open'}><summary>Focal + opponent names</summary><div class="metafields"><div><label>Focal athlete</label><input type="text" value="${h(p.focal)}" oninput="setPerson('focal',this.value)" autocomplete="off"></div><div><label>Opponent · shared W/X</label><input type="text" value="${h(p.a)}" oninput="setPerson('a',this.value)" autocomplete="off"></div></div><div class="short" style="margin-top:7px">P1 and P2 names carry from opening to closing probe.</div></details><details ${isOverride?'open':''}><summary>Different opponent this probe? (optional)</summary><input type="text" placeholder="Override opponent for this probe only" value="${h(r.probeOpponent)}" oninput="setProbeOpponent(this.value)" autocomplete="off"></details></section>`}
return `<section class="panel context"><div class="context-top"><strong>${selected.slot==='F1'?'Trio 1':'Trio 2'} · ${h(p.focal||'Focal unnamed')}</strong><span class="quiet">F = focal · O = selected opponent</span></div><div class="choose"><small>Opponent</small><div class="seg">${[['A',p.a||'Mate A'],['B',p.b||'Mate B']].map(([v,name])=>`<button class="${r.mate===v?'on':''}" onclick="setContext('mate','${v}')">${h(name)}</button>`).join('')}</div></div><details ${p.focal&&p.a&&p.b?'':'open'}><summary>Trio names · same focal across R1/R2</summary><div class="metafields">${[['focal','Focal'],['a','Mate A'],['b','Mate B']].map(([key,label])=>`<div><label>${h(label)}</label><input type="text" placeholder="${h(label)}" value="${h(p[key])}" oninput="setPerson('${key}',this.value)" autocomplete="off"></div>`).join('')}</div></details></section>`}
function exportRows(){const cols=['session_id','date','attire','game_slot','game_name','round','focal_slot','trio','focal_id','mate_a','mate_b','opponent_id','event_index','exchange_no','event_type','standing_entry','phase_response','consequence_10s','entry_link','focal_role','start_relation','starting_side','actor','winner','outcome_method','threats_before_outcome','note'];const rows=[cols.join('\t')];function append(obj){rows.push(cols.map(col=>String(obj[col]??'').replace(/[\r\n\t]+/g,' ')).join('\t'))}
for(const g of GAMES)for(const round of g.rounds)for(const slot of g.slots){const p=state.rosters[rosterKey(g.key,slot)],r=state.records[recordKey(g.key,round,slot)];if(!p.focal.trim()&&!r.events.length&&!r.note.trim())continue;const info={session_id:SESSION.id,date:state.date,attire:SESSION.attire,game_slot:g.key,game_name:g.name,round,focal_slot:slot,trio:g.probe?'':slot==='F1'?'1':'2',focal_id:p.focal,mate_a:p.a,mate_b:g.probe?'':p.b,note:r.note};append({...info,event_type:'roster',opponent_id:g.probe?(r.probeOpponent||p.a):''});let ex=1,seen=[];
for(let i=0;i<r.events.length;i++){const e=r.events[i],obj={...info,opponent_id:e.opponent||'',event_index:i+1,exchange_no:ex};if(e.type==='entry'){obj.event_type='standing_entry';obj.standing_entry=e.code}
else if(e.type==='phase'){obj.event_type='phase';obj.phase_response=e.response;obj.consequence_10s=e.consequence;obj.entry_link=e.entryLink||''}
else if(e.type==='submission'){obj.event_type='submission';obj.actor=e.actor}
else if(e.type==='threat'){obj.event_type='threat';obj.actor=e.actor;obj.outcome_method=e.method;seen.push(e)}
else if(e.type==='outcome'){obj.event_type='outcome';obj.winner=e.winner;obj.outcome_method=e.method;obj.focal_role=g.key==='T'?e.role:'';obj.start_relation=g.key==='T'?e.start:'';obj.starting_side=g.key==='D'?e.side:'';obj.threats_before_outcome=seen.map(t=>`${t.actor}:${t.method}`).join('|');seen=[];ex++}
append(obj);if(g.probe&&e.type==='submission')ex++}
}return rows.join('\n')}
function download(){flush();const a=document.createElement('a');const u=URL.createObjectURL(new Blob([exportRows()],{type:'text/tab-separated-values;charset=utf-8'}));a.href=u;a.download=`${SESSION.id}-${state.date}.tsv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function toggleExport(){selected.export=!selected.export;render()}
async function copyTSV(){const data=exportRows();try{await navigator.clipboard.writeText(data);const x=document.getElementById('exportStatus');if(x)x.textContent='Copied'}catch(e){const ta=document.getElementById('exportText');if(ta){ta.select();document.execCommand('copy')}const x=document.getElementById('exportStatus');if(x)x.textContent='Text selected · copy manually if necessary'}}
function render(){const g=game(),r=rec();const allSlots=g.slots;document.getElementById('app').innerHTML=`<header><div><h1>${h(SESSION.title)}</h1><small>${h(SESSION.attire)} · ${g.probe?'unscaffolded probe':'trio rotation'} <span id="status">· autosave</span></small></div><input type="date" class="date" aria-label="Session date" value="${h(state.date)}" onchange="setDate(this.value)"></header><nav class="nav">${GAMES.map(b=>`<button class="${selected.game===b.key?'on':''}" onclick="setGame('${b.key}')">${h(b.short)}</button>`).join('')}</nav><div class="bar"><div class="seg">${g.rounds.map(x=>`<button class="${selected.round===x?'on':''}" onclick="setRound('${x}')">${h(x)}</button>`).join('')}</div><div class="seg foci">${allSlots.map(x=>{const p=state.rosters[rosterKey(g.key,x)];return `<button class="${selected.slot===x?'on':''}" onclick="setSlot('${x}')">${h(x)}${p.focal?' · '+h(p.focal):''}</button>`}).join('')}</div></div><div class="panel"><div class="context-top"><h2>${h(g.name)}</h2><span class="quiet">5 min ${g.probe?'· submission-only':'· winner stays'}</span></div><details><summary>Rules</summary><div class="info">${h(g.rule)} ${g.probe?'':'If no win after about 90 seconds, rotate without a winner; longest-competing athlete steps out. Third athlete coaches one competitor.'}</div></details></div>${identity()}${g.probe?probeUI():g.key==='T'?triangleUI():g.key==='G'?pullUI():dogUI()}<section class="panel"><details><summary>Coach note (optional)</summary><textarea class="notes" placeholder="Coach observation, separate from event counts" oninput="setNote(this.value)">${h(r.note)}</textarea></details></section><footer><button class="primary" onclick="download()">Download TSV</button><button onclick="toggleExport()">${selected.export?'Hide export':'Copy / preview TSV'}</button></footer>${selected.export?`<section class="panel export"><button onclick="copyTSV()">Copy TSV</button> <small id="exportStatus">Named lanes export even with zero events; unnamed unused lanes are omitted.</small><textarea class="exportText" id="exportText" readonly>${h(exportRows())}</textarea></section>`:''}<div class="footer-note">W + X: same two focal athletes. T/G/D: two focal athletes from two different trios, each followed in both rounds (six focused-game athletes). No bands. Each box has its own Undo and readable history. Selected roles/sides do not change automatically. A missing event tap in an actively observed lane is treated as no observed occurrence; a lane never observed is not evidence of zero.</div>`}
render();

</script>
</body>
