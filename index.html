<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121820"><title>Pinning S5 · Mat Clipboard</title>
<style>
:root{color-scheme:dark;--bg:#11171e;--surface:#1c2630;--edge:#34424f;--text:#f3f5f7;--sub:#afbfca;--accent:#92bfe8;--ok:#b9e0c5;--bad:#edc6b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.32 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.36;cursor:default}main{max-width:920px;margin:auto;padding:0 12px 35px}h1,h2,p{margin:0}h1{font-size:19px;letter-spacing:-.02em}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 9px}header .quiet{font-size:11px;color:var(--sub)}.export{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:9px;min-height:39px;padding:5px 12px;font-weight:750;white-space:nowrap}
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 9px;border-bottom:1px solid var(--edge)}.steps{display:grid;grid-template-columns:53px minmax(0,1fr) 62px;gap:5px}.steps>button,.steps select{min-height:47px;border:1px solid var(--edge);background:var(--surface);border-radius:9px;font-weight:750}.steps>button{font-size:23px}.steps select{width:100%;padding:5px 10px;font-size:14px;text-align:center;text-align-last:center}.focals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}.focals button{min-width:0;min-height:44px;padding:5px 4px;background:#19222b;border:1px solid var(--edge);border-radius:9px;font-weight:700}.focals button.selected{border:2px solid var(--accent);background:#263b4e;padding:4px 3px}.focals .fname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.focals .rname{display:block;font-size:10px;color:var(--sub);margin-top:2px}.banner{display:flex;justify-content:space-between;gap:7px;align-items:baseline;padding:13px 1px 8px}.banner strong{font-size:18px}.banner span{font-size:12px;color:var(--sub);text-align:right}.context{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--edge);border-radius:11px;padding:11px;margin-bottom:10px}.contextline{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint{color:var(--sub);font-size:12px}.role{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:0 0 184px}.role button{min-height:44px;border:1px solid var(--edge);background:#26333f;border-radius:8px;font-weight:800}.role button.chosen{background:#304b61;border:2px solid var(--accent)}.role button.chosen.bottom{background:#354a39;border-color:var(--ok)}.partner{display:flex;align-items:center;gap:9px}.partner label{font-size:13px;color:var(--sub)}.partner input{flex:1;min-width:0;min-height:39px;border:1px solid var(--edge);border-radius:8px;background:#121b23;padding:8px}.warning{font-size:12px;color:#efcaa0}
.panel{background:var(--surface);border:1px solid var(--edge);border-radius:11px;padding:10px;margin:9px 0}.paneltop{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}.panel h2{font-size:15px}.panel .count{font-size:11px;color:var(--sub)}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(107px,1fr));gap:6px}.actions button{min-height:49px;padding:7px 5px;line-height:1.13;background:#293c4e;border:1px solid #526b81;border-radius:8px;font-weight:750;font-size:13px}.actions button.negative{background:#463732;border-color:#8e655b}.actions button.positive{background:#294436;border-color:#597e63}.bottomrow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-top:7px}.history{font-size:12px;color:var(--sub);min-width:0;max-height:82px;overflow-y:auto;flex:1}.history div{padding:2px 0}.undo{background:transparent;border:1px solid var(--edge);border-radius:7px;padding:5px 11px;min-height:31px;font-size:12px;white-space:nowrap}details{border-top:1px solid var(--edge);margin-top:12px;padding:10px 1px}summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:750}.detailbody{padding:9px 0 0;font-size:13px;color:var(--sub)}.detailbody p+p{margin-top:7px}.detailbody strong{color:var(--text)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.fields label{font-size:12px}.fields input,.fields select,.date,.note{width:100%;min-height:38px;background:var(--surface);border:1px solid var(--edge);border-radius:7px;padding:7px;margin:4px 0 8px}.fields input{min-width:0}.date{max-width:250px}.note{min-height:65px}.pairings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pairings label{font-size:11px}.pairings select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--edge);padding:6px;border-radius:7px}.foot{color:var(--sub);font-size:11px;padding:11px 0}#status{font-size:11px;color:var(--sub)}
@media(min-width:720px){main{padding-left:17px;padding-right:17px}header{padding:9px 0 4px}.sticky{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;padding:6px 0}.focals{margin-top:0}.context{grid-template-columns:1fr 1fr;align-items:center}.partner{grid-column:2;grid-row:1}.contextline{grid-column:1;grid-row:1}.panel{display:grid;grid-template-columns:185px minmax(0,1fr);gap:8px;padding:8px 11px;margin:6px 0}.paneltop{grid-column:1;align-items:flex-start;flex-direction:column;justify-content:flex-start;margin:0}.actions{grid-column:2}.bottomrow{grid-column:2;margin-top:0}.actions button{min-height:43px}.history{max-height:63px}}
@media(max-width:420px){main{padding-left:9px;padding-right:9px}.role{flex-basis:174px}.fields{grid-template-columns:1fr}.pairings{grid-template-columns:repeat(2,1fr)}.banner strong{font-size:16px}.banner span{font-size:11px}.context{padding:9px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><main>
<header><div><h1>Pinning · Session 5</h1><span class="quiet">24 min · W → G1 → G2 → G3</span></div><button class="export" onclick="downloadTSV()">Export TSV ↓</button></header>
<div class="sticky"><div class="steps"><button id="back" onclick="moveStep(-1)" aria-label="Previous round">‹</button><select id="step" aria-label="Active game and round" onchange="selectStep(this.value)"></select><button id="next" onclick="moveStep(1)" aria-label="Next round">›</button></div><nav class="focals" id="focals" aria-label="Focal athlete"></nav></div>
<div class="banner"><strong id="gameTitle"></strong><span id="gameInfo"></span></div>
<section class="context" aria-label="Active recording context"><div class="contextline"><div><div class="hint">Focal role <span id="roleHint"></span></div><div class="warning" id="roleWarning"></div></div><div class="role"><button id="top" onclick="setRole('top')">TOP</button><button id="bottom" onclick="setRole('bottom')">BOTTOM</button></div></div><div class="partner"><label for="opponent">Partner</label><input id="opponent" autocomplete="off" placeholder="optional" oninput="setPartner(this.value)"></div></section>
<div id="panels"></div>
<details id="rules"><summary>Start / goals / reset</summary><div id="ruleText" class="detailbody"></div></details>
<details id="coach"><summary>Coach note (optional)</summary><div class="detailbody"><textarea id="note" class="note" placeholder="Observed action, not inferred intent" oninput="setNote(this.value)"></textarea></div></details>
<details id="setup"><summary>Athletes, date & pairing</summary><div class="detailbody"><label for="date">Session date</label><input class="date" type="date" id="date" onchange="setDate(this.value)"><div class="fields" id="athleteSetup"></div><p style="margin:8px 0">Actual pairing (edit only if the plan changes)</p><div class="pairings" id="pairings"></div></div></details>
<div class="foot"><span id="status">Saved locally</span> · Export after class. A blank event history means unrecorded, not a confirmed zero.</div>
</main>
<script>
'use strict';
const ID='pinning-s5-retain-resist-recreate-v1';
const KEY='matclip:'+ID;
const GAMES={
 W:{name:'Recurring Guard Probe',short:'Guard probe',minutes:6,rounds:1,pairing:'Mixed bands',start:'Seated open guard. Top begins engaged inside passing range.',top:'Pass the legs and hold for as long as possible. If guard returns, pass again. No win.',bottom:'Get chest to back, get on top, or submit.',reset:'A bottom win switches roles. Standing alone resets with the same roles.',groups:[{id:'bottom',title:'Bottom actions',options:[['got_top','Got on top · win','positive'],['back','Chest-to-back · win','positive'],['tap','Submission · win','positive'],['stand_try','Stand attempt',''],['stood','Stood · reset','']]},{id:'top',title:'Top seated / supine',options:[['lost','Top seated / supine','negative']]},{id:'pass',title:'Pass & hold',options:[['pass','Pass','positive'],['guard','Guard returned',''],['held','Held at bell','positive']]}]},
 G1:{name:'Turn and Flatten',short:'Continuous pin',minutes:3,rounds:2,pairing:'Within bands',start:'Settled side control; bottom starts turned onto a side.',top:'Force bottom supine and keep them there. If bottom turns to a side, turn them supine again.',bottom:'Turn onto either side and stay there. If flattened, turn again.',reset:'Continuous, no wins. If side control is completely lost, restart. Same partner, opposite role in round 2.',groups:[{id:'sit',title:'Top seated · no pin',options:[['sit','Top seated · no pin','negative']]}]},
 G2:{name:'Turn, Flatten and Reverse',short:'Reversal allowed',minutes:3,rounds:2,pairing:'Within bands',start:'Same settled side-control start, bottom turned onto a side.',top:'Force bottom supine and keep them there.',bottom:'Turn onto a side and stay there, or get on top.',reset:'Getting on top wins and resets with the same roles. No re-guarding; reset if guard returns. Reverse roles in round 2.',groups:[{id:'sit',title:'Top seated · no pin',options:[['sit','Top seated · no pin','negative']]},{id:'reverse',title:'Bottom reversed',options:[['top','Bottom got on top · win','positive']]}]},
 G3:{name:'Establish the Pin',short:'Unsettled post-pass',minutes:3,rounds:2,pairing:'Mixed bands',start:'Top begins beyond both legs; bottom partly turned to a side. No settled pin.',top:'Establish a pin and hold as long as possible. If guard returns, pass again. No win.',bottom:'Get on top, stand, get chest to back, or submit.',reset:'A bottom win resets to the same start and same roles. Same partner, opposite role in round 2.',groups:[{id:'pin',title:'Top pin',options:[['established','Pin established','positive'],['held','Held at bell','positive']]},{id:'bottom',title:'Bottom wins',options:[['got_top','Got on top','positive'],['stood','Stood','positive'],['back','Chest-to-back','positive'],['tap','Submission','positive']]}]}
};
const STEPS=[{g:'W',r:1},{g:'G1',r:1},{g:'G1',r:2},{g:'G2',r:1},{g:'G2',r:2},{g:'G3',r:1},{g:'G3',r:2}];
const BANDS=[['','Band unknown'],['under','Up to 3 years'],['over','Over 3 years / serious competitors']];
const init=()=>({id:ID,date:'',step:0,focal:0,seq:0,athletes:Array.from({length:3},()=>({name:'',band:''})),pairings:Object.fromEntries(Object.entries(GAMES).map(([k,v])=>[k,v.pairing])),contexts:{}});
let db;let storageOK=true;
try{db=JSON.parse(localStorage.getItem(KEY))||init()}catch(e){db=init();storageOK=false}
if(!db||db.id!==ID)db=init();
function ensure(){db.athletes=(Array.isArray(db.athletes)?db.athletes:[]).slice(0,3);while(db.athletes.length<3)db.athletes.push({name:'',band:''});db.contexts=db.contexts||{};db.pairings=db.pairings||{};db.step=Math.min(6,Math.max(0,+db.step||0));db.focal=Math.min(2,Math.max(0,+db.focal||0));db.seq=+db.seq||0}ensure();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function now(){return new Date().toLocaleTimeString('en-GB',{hour12:false})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}let el=document.getElementById('status');if(el)el.textContent=storageOK?'Saved locally':'Local save blocked — export now'}
function current(){return STEPS[db.step]}
function ck(g,r,i){return g+':'+r+':'+i}
function ctx(g=current().g,r=current().r,i=db.focal){const k=ck(g,r,i);return db.contexts[k]||(db.contexts[k]={role:'',partner:'',roleHistory:[],events:[],note:''})}
function other(r){return r===1?2:1}
function inv(role){return role==='top'?'bottom':'top'}
function labelAthlete(i){return db.athletes[i]?.name||'F'+(i+1)}
function setRole(role){const {g,r}=current(),c=ctx();if(c.role===role&&(!GAMES[g].rounds||GAMES[g].rounds===1||ctx(g,other(r)).role===inv(role)))return;c.role=role;c.roleHistory.push({role,at:now(),by:'manual'});if(GAMES[g].rounds===2){const pair=ctx(g,other(r));pair.role=inv(role);pair.roleHistory.push({role:pair.role,by:'paired'})}save();render()}
function setPartner(v){const {g,r}=current();ctx().partner=v;if(GAMES[g].rounds===2)ctx(g,other(r)).partner=v;save()}
function setNote(v){ctx().note=v;save()}
function setDate(v){db.date=v;save()}
function setAthlete(i,field,v){db.athletes[i][field]=v;save();if(field==='name'){const el=document.querySelectorAll('.fname')[i];if(el)el.textContent='F'+(i+1)+' · '+(v||'unnamed').slice(0,15)}}
function setPairing(g,v){if(['Within bands','Mixed bands'].includes(v)){db.pairings[g]=v;save();render()}}
function selectStep(v){db.step=Math.max(0,Math.min(6,Number(v)||0));save();render()}
function moveStep(n){selectStep(db.step+n)}
function selectFocal(i){db.focal=i;save();render()}
function record(group,value){const {g}=current(),def=GAMES[g].groups.find(x=>x.id===group),opt=def?.options.find(x=>x[0]===value),c=ctx();if(!opt||!['top','bottom'].includes(c.role))return;c.events.push({id:++db.seq,group,value,role:c.role,at:now()});save();render()}
function undo(group){const c=ctx();for(let i=c.events.length-1;i>=0;i--){if(c.events[i].group===group){c.events.splice(i,1);save();render();return}}}
function eventLabel(g,group,value){return GAMES[g].groups.find(x=>x.id===group)?.options.find(x=>x[0]===value)?.[1]||value}
function panel(p){const {g}=current(),items=ctx().events.filter(e=>e.group===p.id),actions=p.options.map(o=>`<button class="${o[2]||''}" onclick="record('${p.id}','${o[0]}')" ${ctx().role?'':'disabled'}>${esc(o[1])}</button>`).join('');return `<section class="panel"><div class="paneltop"><h2>${esc(p.title)}</h2><span class="count">${items.length} logged</span></div><div class="actions">${actions}</div><div class="bottomrow"><div class="history">${items.length?items.map((e,i)=>`<div>${i+1}. ${esc(eventLabel(g,e.group,e.value))} · focal ${esc(e.role)} · ${esc(e.at)}</div>`).join(''):'No events logged'}</div><button class="undo" onclick="undo('${p.id}')" ${items.length?'':'disabled'}>Undo</button></div></section>`}
function render(){const {g,r}=current(),game=GAMES[g],c=ctx();document.getElementById('step').innerHTML=STEPS.map((s,i)=>`<option value="${i}" ${db.step===i?'selected':''}>${s.g} · ${esc(GAMES[s.g].name)} · ${s.g==='W'?'6 min':'R'+s.r+'/2'}</option>`).join('');document.getElementById('back').disabled=db.step===0;document.getElementById('next').disabled=db.step===6;
 document.getElementById('focals').innerHTML=db.athletes.map((a,i)=>{const rc=ctx(g,r,i);return `<button class="${i===db.focal?'selected':''}" onclick="selectFocal(${i})"><span class="fname">F${i+1} · ${esc((a.name||'unnamed').slice(0,15))}</span><span class="rname">${esc(rc.role?rc.role.toUpperCase():'ROLE ?')}</span></button>`}).join('');
 document.getElementById('gameTitle').textContent=g+' · '+game.name;
 document.getElementById('gameInfo').textContent=(g==='W'?'6 min':'Round '+r+'/2 · 3 min')+' · '+(db.pairings[g]||game.pairing);
 document.getElementById('top').className=c.role==='top'?'chosen':'';document.getElementById('bottom').className=c.role==='bottom'?'chosen bottom':'';document.getElementById('roleHint').textContent=g==='W'?'· change after bottom win':'· roles reverse in R2';document.getElementById('roleWarning').textContent=c.role?'':'Select TOP or BOTTOM';document.getElementById('opponent').value=c.partner||'';
 document.getElementById('panels').innerHTML=game.groups.map(panel).join('');document.getElementById('ruleText').innerHTML=`<p><strong>Start:</strong> ${esc(game.start)}</p><p><strong>Top:</strong> ${esc(game.top)}</p><p><strong>Bottom:</strong> ${esc(game.bottom)}</p><p><strong>Reset:</strong> ${esc(game.reset)}</p>${g==='G1'||g==='G2'?'<p><strong>Coach-only measure:</strong> Top butt on mat without a pin; exclude seated chest-to-back control.</p>':''}${g==='G3'?'<p><strong>Coach-only measure:</strong> Pin established means settled positional control beyond the legs, not a momentary contact. Held at bell means the pin remains at the end of that round.</p>':''}`;document.getElementById('note').value=c.note||'';document.getElementById('date').value=db.date||'';
 document.getElementById('athleteSetup').innerHTML=db.athletes.map((a,i)=>`<label>F${i+1} name<input aria-label="F${i+1} name" placeholder="Name" value="${esc(a.name)}" oninput="setAthlete(${i},'name',this.value)"><select aria-label="F${i+1} band" onchange="setAthlete(${i},'band',this.value)">${BANDS.map(b=>`<option value="${b[0]}" ${a.band===b[0]?'selected':''}>${esc(b[1])}</option>`).join('')}</select></label>`).join('');
 document.getElementById('pairings').innerHTML=Object.entries(GAMES).map(([id,v])=>`<label>${id}<select onchange="setPairing('${id}',this.value)"><option value="Within bands" ${(db.pairings[id]||v.pairing)==='Within bands'?'selected':''}>Within</option><option value="Mixed bands" ${(db.pairings[id]||v.pairing)==='Mixed bands'?'selected':''}>Mixed</option></select></label>`).join('');
 document.getElementById('status').textContent=storageOK?'Saved locally':'Local save blocked — export now';}
function clean(s){return String(s??'').replace(/[\t\r\n]+/g,' ').trim()}
function history(c,g,group){return c.events.filter(e=>e.group===group).map(e=>`focal-${e.role}: ${eventLabel(g,e.group,e.value)}@${e.at}`).join(' / ')}
function tsv(){const h=['session_id','session_date','game','round','round_minutes','planned_start','actual_pairing','focal_athlete','band','partner','focal_role','role_history','bottom_actions','top_seated_supine','pass_hold','top_seated_without_pin','bottom_reversal','top_pin','coach_note'];const rows=[h.join('\t')];for(const g of Object.keys(GAMES)){for(let r=1;r<=GAMES[g].rounds;r++)for(let i=0;i<3;i++){const c=db.contexts[ck(g,r,i)];if(!c)continue;if(!c.role&&!c.events.length&&!c.partner&&!c.note)continue;const a=db.athletes[i];const cols=[ID,db.date,g,r,GAMES[g].minutes,GAMES[g].start,db.pairings[g]||GAMES[g].pairing,a.name||'F'+(i+1),BANDS.find(x=>x[0]===a.band)?.[1]||'',c.partner,c.role,c.roleHistory.map(e=>`${e.role}${e.by==='paired'?' (paired)':'@'+e.at}`).join(' / '),history(c,g,'bottom'),history(c,g,'top'),history(c,g,'pass'),history(c,g,'sit'),history(c,g,'reverse'),history(c,g,'pin'),c.note];rows.push(cols.map(clean).join('\t'))}}return rows.join('\n')+'\n'}
function downloadTSV(){const blob=new Blob([tsv()],{type:'text/tab-separated-values;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=ID+(db.date?'-'+db.date:'')+'.tsv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();if(!db.athletes.some(a=>a.name))document.getElementById('setup').open=true;
</script></body></html>
