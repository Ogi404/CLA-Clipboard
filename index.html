<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141a20">
<title>Execution 01 · Final Session Clipboard</title>
<style>
:root{color-scheme:dark;--bg:#131a20;--surface:#1d2730;--inner:#27333e;--edge:#3d4b58;--text:#f4f7fa;--mute:#b0bfcc;--focal:#7fe1b7;--opp:#ffc294;--blue:#8dc2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{max-width:850px;margin:0 auto;padding:12px 12px 50px}button,input,textarea{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:12px}.top h1{font-size:19px;margin:0 0 3px;letter-spacing:-.02em}.small,.hint{color:var(--mute);font-size:12px}.run{display:flex;gap:6px}.run button{font-size:13px;border-radius:9px;padding:10px 9px;min-height:41px;white-space:nowrap;border:1px solid var(--edge);background:var(--surface);color:var(--text)}.run button.active,.tabs button.active,.subtabs button.active{background:#315e82;border-color:#8dc2ff;color:#fff}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:0 0 10px}.tabs button{border:1px solid var(--edge);min-height:47px;border-radius:9px;background:var(--surface);color:var(--text);font-weight:700;font-size:12px;line-height:1.2;padding:6px 1px}.tab-sub{display:block;font-size:10px;font-weight:500;color:var(--mute)}.tabs button.active .tab-sub{color:#e0eefc}
.subbar{background:var(--surface);border:1px solid var(--edge);border-radius:11px;padding:9px;display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:10px}.subtabs{display:flex;gap:5px;flex-wrap:wrap}.subtabs button{background:var(--inner);color:var(--text);border:1px solid var(--edge);border-radius:8px;min-height:41px;padding:8px 11px;font-size:13px;font-weight:700}
.panel,.measure{background:var(--surface);border:1px solid var(--edge);border-radius:11px;margin-bottom:9px;padding:11px}.panel h2{font-size:16px;margin:0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.rules{font-size:13px;color:var(--mute);line-height:1.5;margin-top:8px}.rules strong{color:var(--text)}summary{cursor:pointer;font-size:13px;color:var(--mute);padding:5px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}input,textarea{background:var(--inner);border:1px solid var(--edge);border-radius:7px;padding:9px;color:var(--text);font-size:16px;width:100%;min-height:42px}textarea{min-height:65px;resize:vertical}input[type=date]{min-width:142px;width:auto;font-size:13px}.person-header{font-weight:700;font-size:15px}.muted{color:var(--mute);font-size:12px}
.measure-head{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:8px}.measure-head strong{font-size:14px}.undo{padding:6px 10px;min-height:35px;border:1px solid var(--edge);border-radius:8px;color:var(--mute);background:transparent;font-size:12px}.undo:disabled{opacity:.33;cursor:default}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.actions button{background:var(--inner);border:1px solid var(--edge);border-radius:8px;color:var(--text);font-size:14px;font-weight:650;min-height:50px;padding:7px 5px;line-height:1.25}.actions button.f{color:var(--focal);border-color:#477b68}.actions button.o{color:var(--opp);border-color:#946b52}.actions button.neutral{color:var(--mute)}.actions button:active{transform:scale(.985);filter:brightness(1.35)}.actions button:disabled{opacity:.35;cursor:default}.actions.phase{grid-template-columns:repeat(3,minmax(0,1fr))}.actions.phase button{min-height:44px}.history{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap;max-height:150px;overflow:auto}.chip{font-size:12px;border-radius:6px;padding:5px 7px;background:var(--inner);border-left:3px solid #728292}.chip.f{border-color:var(--focal)}.chip.o{border-color:var(--opp)}.none{font-size:12px;color:#8395a3}.short-note{color:var(--mute);font-size:12px;margin-bottom:7px}.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.foot button{background:var(--surface);border:1px solid var(--edge);border-radius:9px;color:var(--text);min-height:44px;padding:10px 14px;font-weight:700}.foot button.primary{background:#315e82;border-color:#8dc2ff}.export-area{font-size:12px;min-height:180px;font-family:ui-monospace,monospace}.disclaimer{font-size:12px;color:var(--mute);line-height:1.5;margin:12px 2px}.tight{margin-top:7px}
@media(min-width:700px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}.actions.phase{grid-template-columns:repeat(9,minmax(0,1fr))}.tabs button{font-size:14px}.panel,.measure{padding:14px}}
@media(max-width:390px){main{padding-inline:8px}.tabs{gap:3px}.tabs button{font-size:11px}.run button{padding:9px 6px}.actions button{min-height:47px;font-size:13px}}
</style>
</head>
<body><main id="app"></main>
<script>
'use strict';
const SESSION_ID='execution01-final-mon-tue-v1';
const RUNS=[{id:'monday-gi',label:'Mon · Gi',date:'2026-11-09',attire:'Gi'},{id:'tuesday-nogi',label:'Tue · No-Gi',date:'2026-11-10',attire:'No-Gi'}];
const GAMES=[
 {key:'W',tab:'W',sub:'probe',name:'Opening frozen probe',rounds:['W'],probe:true,area:'standing',rules:'Standing, unrestricted legal choices, submission-only. No positional scores. After submission restart standing. Keep the original probe categories; do not mention desired attacks.'},
 {key:'G1',tab:'1',sub:'standing',name:'Standing · Pulls only',rounds:['R1','R2'],start:'standing',td:false,area:'standing',rules:'Start standing. Both may pull guard; takedowns prohibited. After establishing ground engagement, both can attack, score and submit. First valid positional score or any legal submission wins; restart standing.'},
 {key:'G2',tab:'2',sub:'standing',name:'Standing · Pulls + takedowns',rounds:['R1','R2'],start:'standing',td:true,area:'standing',rules:'Same as Game 1 except takedowns are allowed. Pulls remain allowed. First valid positional score or any legal submission wins; restart standing.'},
 {key:'G3',tab:'3',sub:'kneeling',name:'Kneeling · Guard engagement',rounds:['R1','R2'],start:'kneeling',td:false,area:'guard',rules:'Start both kneeling and engaged. They may establish guard or rise during the live exchange, but direct wrestling takedowns are prohibited. First valid positional score or any legal submission wins; restart both kneeling.'},
 {key:'G4',tab:'4',sub:'kneeling',name:'Kneeling · Wrestling allowed',rounds:['R1','R2'],start:'kneeling',td:true,area:'guard',rules:'Same kneeling start as Game 3, but wrestling/takedowns are allowed. Players may rise. A mere change to top from both knees is NOT automatically a GI takedown score; official-style takedown points require an eligible standing attack. First valid positional score or any legal submission wins; restart both kneeling.'},
 {key:'X',tab:'X',sub:'probe',name:'Closing frozen probe',rounds:['X'],probe:true,area:'standing',rules:'Exactly the opening frozen probe: standing, unrestricted legal choices, submission-only, no positional points, standing restart after submission. Same P1/P2 focal athletes and ideally the same opponents.'}
];
const PROBE_CODES=[['P','Pull'],['T','Takedown'],['O','Other'],['R','Opponent first'],['N','No entry'],['?','Unclear']];
const NEG=['+','=','-'];const RESP=['A','D','H'];
let runId=RUNS[0].id,selected={game:'W',round:'W',slot:'P1',preview:false};
const runInfo=()=>RUNS.find(x=>x.id===runId);
const curGame=()=>GAMES.find(x=>x.key===selected.game);
const slots=g=>g.probe?['P1','P2']:['F1','F2'];
const rosterKey=(g,s)=>((g==='W'||g==='X')?'PROBE':g)+'|'+s;
const recordKey=(g,r,s)=>g+'|'+r+'|'+s;
const newRecord=()=>({events:[],opponent:'',note:''});
function blankState(r){const st={date:r.date,rosters:{},records:{}};for(const g of GAMES)for(const slot of slots(g)){const k=rosterKey(g.key,slot);if(!st.rosters[k])st.rosters[k]={focal:'',probeOpponent:''};for(const rnd of g.rounds)st.records[recordKey(g.key,rnd,slot)]=newRecord()}return st}
const storageKey=r=>'matclip:'+SESSION_ID+':'+r;
function load(r){const st=blankState(RUNS.find(x=>x.id===r));try{const x=JSON.parse(localStorage.getItem(storageKey(r))||'null');if(!x)return st;if(typeof x.date==='string')st.date=x.date;for(const k of Object.keys(st.rosters))if(x.rosters?.[k]){st.rosters[k].focal=String(x.rosters[k].focal??'');st.rosters[k].probeOpponent=String(x.rosters[k].probeOpponent??'')};for(const k of Object.keys(st.records))if(x.records?.[k]){st.records[k].opponent=String(x.records[k].opponent??'');st.records[k].note=String(x.records[k].note??'');st.records[k].events=Array.isArray(x.records[k].events)?x.records[k].events.filter(e=>e&&typeof e==='object'):[]}}catch(e){}return st}
let state=load(runId),saveHandle=null;
function flush(){clearTimeout(saveHandle);try{localStorage.setItem(storageKey(runId),JSON.stringify(state));const el=document.querySelector('#saveStatus');if(el)el.textContent='Saved'}catch(e){const el=document.querySelector('#saveStatus');if(el)el.textContent='Export needed'}}
function save(){clearTimeout(saveHandle);saveHandle=setTimeout(flush,120)}
function h(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
const record=()=>state.records[recordKey(selected.game,selected.round,selected.slot)];
const roster=()=>state.rosters[rosterKey(selected.game,selected.slot)];
function switchRun(r){flush();runId=r;state=load(r);selected={game:'W',round:'W',slot:'P1',preview:false};render()}
function changeGame(g){flush();selected.game=g;selected.round=curGame().rounds[0];selected.slot=slots(curGame())[0];render()}
function changeRound(r){flush();selected.round=r;render()}
function changeSlot(s){flush();selected.slot=s;render()}
function setDate(s){state.date=s;save()}
function setRoster(field,v){roster()[field]=v;save()}
function setRecord(field,v){record()[field]=v;save()}
function currentExchange(r=record(),probe=curGame().probe){return 1+r.events.reduce((n,e)=>n+((e.kind==='outcome'||e.kind==='neutral'||(probe&&e.kind==='probe_submission'))?1:0),0)}
function currentHasResolution(){const r=record(),x=currentExchange();let ex=1;for(const e of r.events){if(e.kind==='resolution'&&ex===x)return true;if(e.kind==='outcome'||e.kind==='neutral'||(curGame().probe&&e.kind==='probe_submission'))ex++}return false}
function add(kind,value,actor='',detail=''){const e={kind,value,actor,detail,opponent:curGame().probe?(record().opponent||roster().probeOpponent):record().opponent};if(kind==='resolution'&&currentHasResolution())return;record().events.push(e);save();render()}
function undo(kind){const es=record().events;for(let i=es.length-1;i>=0;i--)if(es[i].kind===kind){es.splice(i,1);save();render();return}}
function uiBtn(label,kind,value,actor='',detail='',css=''){const fn=`add('${kind}','${value}','${actor}','${detail}')`;return `<button type="button" class="${css}" onclick="${fn}" ${kind==='resolution'&&currentHasResolution()?'disabled':''}>${h(label)}</button>`}
function measure(name,kind,body,extra=''){return `<section class="measure"><div class="measure-head"><strong>${h(name)}</strong><button class="undo" onclick="undo('${kind}')" ${record().events.some(e=>e.kind===kind)?'':'disabled'}>↶ Undo</button></div>${extra?`<div class="short-note">${h(extra)}</div>`:''}<div class="actions ${kind==='phase'?'phase':''}">${body}</div><div class="history">${history(kind)}</div></section>`}
function labelEvent(e){if(e.kind==='probe_entry')return `${e.value}`;if(e.kind==='phase')return `${e.value}${e.detail}`;if(e.kind==='probe_submission')return `${e.actor} · Sub`;if(e.kind==='entry')return `${e.actor} · ${e.value==='pull'?'Pull':e.value==='guard'?'To guard':'Wrestle/TD'}`;if(e.kind==='ha')return `${e.actor} · ${e.value==='triangle'?'Triangle':'Guillotine'}`;if(e.kind==='resolution')return `${e.actor} · ${e.value==='guard'?'Attacking guard':e.value==='pin'?'Top/pin':'Sub threat'}`;if(e.kind==='outcome')return `${e.actor} · ${e.value==='points'?'Score':e.value==='triangle'?'Triangle sub':e.value==='guillotine'?'Guillotine sub':'Other sub'}`;if(e.kind==='neutral')return 'Neutral reset';return e.value}
function history(kind){let ex=1,n=0,arr=[];const isP=curGame().probe;for(const e of record().events){if(e.kind===kind){n++;const cls=e.actor==='F'?'f':e.actor==='O'?'o':'';arr.push(`<span class="chip ${cls}" title="Exchange ${ex}">${n}. ${h(labelEvent(e))} <span style="opacity:.55">·e${ex}</span></span>`)}if(e.kind==='outcome'||e.kind==='neutral'||(isP&&e.kind==='probe_submission'))ex++}return arr.join('')||'<span class="none">No events recorded</span>'}
function outcomeUI(){const core=[uiBtn('F · First score','outcome','points','F','','f'),uiBtn('O · First score','outcome','points','O','','o')];for(const [val,label] of [['triangle','Triangle'],['guillotine','Guillotine'],['other','Other sub']]){core.push(uiBtn(`F · ${label} tap`,'outcome',val,'F','','f'));core.push(uiBtn(`O · ${label} tap`,'outcome',val,'O','','o'))}core.push(uiBtn('Neutral reset','neutral','reset','','','neutral'));return `<section class="measure"><div class="measure-head"><strong>First score or submission</strong><button class="undo" onclick="undo('outcome')" ${record().events.some(e=>e.kind==='outcome')?'':'disabled'}>↶ Undo win</button></div><div class="short-note">First score or any legal submission ends the exchange. Tap to restart.</div><div class="actions">${core.slice(0,8).join('')}</div><div class="history">${history('outcome')}</div><div class="tight"><button class="undo" onclick="add('neutral','reset')">+ Neutral reset (no winner)</button> <button class="undo" onclick="undo('neutral')" ${record().events.some(e=>e.kind==='neutral')?'':'disabled'}>↶ Undo reset</button></div><div class="history">${history('neutral')}</div></section>`}
function entryUI(){const g=curGame();const choices=[uiBtn('F · Pull','entry','pull','F','','f'),uiBtn('O · Pull','entry','pull','O','','o')];if(g.td)choices.push(uiBtn('F · Takedown attempt','entry','wrestle','F','','f'),uiBtn('O · Takedown attempt','entry','wrestle','O','','o'));return measure('Standing choices','entry',choices.join(''),'Click each observed entry; both may act in one exchange.')}
function haUI(){return measure('HA opportunities','ha',[
 uiBtn('F · Triangle threat','ha','triangle','F','','f'),uiBtn('F · Guillotine threat','ha','guillotine','F','','f'),
 uiBtn('O · Triangle threat','ha','triangle','O','','o'),uiBtn('O · Guillotine threat','ha','guillotine','O','','o')].join(''),'Recognisable attack that forces defence; finish not required.')}
function resolutionUI(){return measure('First scramble resolution','resolution',[
 uiBtn('FG · Guard','resolution','guard','F','','f'),uiBtn('FP · Top / pin','resolution','pin','F','','f'),uiBtn('FS · Sub threat','resolution','submission','F','','f'),
 uiBtn('OG · Guard','resolution','guard','O','','o'),uiBtn('OP · Top / pin','resolution','pin','O','','o'),uiBtn('OS · Sub threat','resolution','submission','O','','o')].join(''),'First clear attack–defence asymmetry per exchange, not necessarily points. Subsequent selections require Undo.')}
function probeUI(){const entry=measure('Standing choice','probe_entry',PROBE_CODES.map(([a,b])=>uiBtn(`${a} · ${b}`,'probe_entry',a)).join(''),'Original frozen probe codes.');const ph=measure('Phase response + 10s consequence','phase',RESP.flatMap(r=>NEG.map(c=>uiBtn(r+c,'phase',r,'',c,c==='+'?'f':c==='-'?'o':''))).join(''),'A attack/advance · D defend/recover · H hold; + / = / − consequence.');const sub=measure('Submissions','probe_submission',uiBtn('F · Submission','probe_submission','submission','F','','f')+uiBtn('O · Submission','probe_submission','submission','O','','o'),'Restart standing; no positional scoring.');return entry+ph+sub+`<details class="panel"><summary>Additional HA observations</summary>${haUI()}</details>`}
function inputFields(){const r=record(),p=roster(),g=curGame();const who=p.focal||'Unnamed focal';const opp=r.opponent||(g.probe?p.probeOpponent:'');return `<section class="panel"><div class="row"><strong class="person-header">${h(selected.slot)} · ${h(who)}</strong><span class="muted">vs ${h(opp||'opponent not named')}</span></div><details ${p.focal&&opp?'':'open'}><summary>Names ${g.probe?'(shared opening / closing)':'(focal carries across R1 / R2)'}</summary><div class="fields"><div><label>Focal athlete</label><input value="${h(p.focal)}" placeholder="Focal" oninput="setRoster('focal',this.value)" autocomplete="off"></div>${g.probe?`<div><label>Default opponent (both probes)</label><input value="${h(p.probeOpponent)}" placeholder="Opponent" oninput="setRoster('probeOpponent',this.value)" autocomplete="off"></div>`:`<div><label>Opponent · ${selected.round}</label><input value="${h(r.opponent)}" placeholder="Opponent" oninput="setRecord('opponent',this.value)" autocomplete="off"></div>`}</div>${g.probe?`<div class="tight"><label>Override opponent in this probe (optional)</label><input value="${h(r.opponent)}" placeholder="Use default if blank" oninput="setRecord('opponent',this.value)" autocomplete="off"></div>`:''}</details></section>`}
const COLS=['session_id','run','date','attire','game_slot','game','round','focal_slot','focal_id','opponent_id','event_index','exchange_no','event_type','value','actor','consequence_10s','first_score_winner','submission_winner','submission_type','ha_actor','ha_type','resolution_actor','resolution_type','note'];
function exportRows(){const rows=[COLS.join('\t')],ri=runInfo();const clean=v=>String(v??'').replace(/[\t\r\n]+/g,' ');function push(obj){rows.push(COLS.map(c=>clean(obj[c])).join('\t'))}for(const g of GAMES)for(const rnd of g.rounds)for(const slot of slots(g)){const p=state.rosters[rosterKey(g.key,slot)],r=state.records[recordKey(g.key,rnd,slot)];if(!p.focal.trim()&&!r.events.length&&!r.note.trim())continue;const meta={session_id:SESSION_ID,run:ri.id,date:state.date,attire:ri.attire,game_slot:g.key,game:g.name,round:rnd,focal_slot:slot,focal_id:p.focal,note:r.note};push({...meta,event_type:'roster',opponent_id:g.probe?(r.opponent||p.probeOpponent):r.opponent});let ex=1;for(let i=0;i<r.events.length;i++){const e=r.events[i],ev={...meta,opponent_id:e.opponent||(g.probe?(r.opponent||p.probeOpponent):r.opponent),event_index:i+1,exchange_no:ex,event_type:e.kind,value:e.value,actor:e.actor};if(e.kind==='phase')ev.consequence_10s=e.detail;if(e.kind==='outcome'){if(e.value==='points')ev.first_score_winner=e.actor;else{ev.submission_winner=e.actor;ev.submission_type=e.value}}if(e.kind==='probe_submission'){ev.submission_winner=e.actor;ev.submission_type='unspecified'}if(e.kind==='ha'){ev.ha_actor=e.actor;ev.ha_type=e.value}if(e.kind==='resolution'){ev.resolution_actor=e.actor;ev.resolution_type=e.value}push(ev);if(e.kind==='outcome'||e.kind==='neutral'||(g.probe&&e.kind==='probe_submission'))ex++}}return rows.join('\n')}
function download(){flush();const content=exportRows(),blob=new Blob([content],{type:'text/tab-separated-values;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=SESSION_ID+'-'+runId+'-'+state.date+'.tsv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function preview(){selected.preview=!selected.preview;render()}
function copyExport(){const el=document.getElementById('tsv');el?.select();try{document.execCommand('copy')}catch(e){}}
function render(){const g=curGame(),ri=runInfo(),r=record(),p=roster();document.getElementById('app').innerHTML=`<header class="top"><div><h1>Execution 01 · Final</h1><div class="small">${h(ri.attire)} · <span id="saveStatus">autosave</span></div></div><div class="run">${RUNS.map(v=>`<button onclick="switchRun('${v.id}')" class="${v.id===runId?'active':''}">${h(v.label)}</button>`).join('')}</div></header><nav class="tabs">${GAMES.map(b=>`<button class="${selected.game===b.key?'active':''}" onclick="changeGame('${b.key}')">${h(b.tab)}<span class="tab-sub">${h(b.sub)}</span></button>`).join('')}</nav><div class="subbar"><div class="subtabs">${g.rounds.map(v=>`<button class="${selected.round===v?'active':''}" onclick="changeRound('${v}')">${h(v)}</button>`).join('')}</div><div class="subtabs">${slots(g).map(v=>`<button class="${selected.slot===v?'active':''}" onclick="changeSlot('${v}')">${h(v)}${state.rosters[rosterKey(g.key,v)].focal?' · '+h(state.rosters[rosterKey(g.key,v)].focal):''}</button>`).join('')}</div></div><section class="panel"><div class="row"><h2>${h(g.name)}</h2><span class="muted">5 min ${g.probe?'· frozen':'· first to score / submit'}</span></div><details><summary>Rules</summary><div class="rules">${h(g.rules)}<div class="tight">Points: TD 2 (when eligible), sweep 2, knee-on-belly 2, pass 3, mount/back 4; three-second control. No advantages. The start-position and allowed-action rules are training adaptations.</div></div></details></section>${inputFields()}${g.probe?probeUI():g.start==='standing'?entryUI()+outcomeUI()+haUI():outcomeUI()+haUI()+resolutionUI()}<section class="panel"><details><summary>Coach note (optional)</summary><textarea placeholder="Separate mat-side observation" oninput="setRecord('note',this.value)">${h(r.note)}</textarea></details></section><div class="foot"><button class="primary" onclick="download()">Export ${h(ri.attire)} TSV</button><button onclick="preview()">${selected.preview?'Hide TSV':'Preview / Copy'}</button><input type="date" aria-label="Session date" value="${h(state.date)}" onchange="setDate(this.value)"></div>${selected.preview?`<section class="panel"><button class="undo" onclick="copyExport()">Copy TSV</button><textarea id="tsv" class="export-area" readonly>${h(exportRows())}</textarea></section>`:''}<p class="disclaimer">Two focal lanes per game, each followed across both rounds; W/X share two probe athletes. No bands. Every recorded event is one tap; each measure retains its history and Undo. No tap in a watched exchange means no recorded occurrence. A roster with no events does not prove that the round was observed. Save your TSV after each day.</p>`}
render();
</script>
</main></body></html>
