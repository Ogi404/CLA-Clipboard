<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pinning S1 · Coaching clipboard</title>
<style>
:root{color-scheme:dark;--bg:#111820;--card:#1c2630;--sub:#25323e;--line:#374653;--text:#f3f7f9;--dim:#adbbc7;--soft:#8497a7;--accent:#76baff;--accentbg:#193b5a;--ok:#77d5a3;--bad:#f5a79f;--warn:#f4d083}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.36}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:730px;margin:0 auto;padding:16px 14px 96px;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:8px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
h1{margin:3px 0 0;font-size:22px;line-height:1.1;letter-spacing:-.025em}
.muted{color:var(--dim)}.tiny{font-size:12px}.small{font-size:13px}.topmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;flex-wrap:wrap}.status{color:var(--ok)}.status.error{color:var(--bad);font-weight:700}
.btn{background:var(--sub);border:1px solid var(--line);border-radius:10px;color:var(--text);min-height:44px;padding:10px 13px;font-weight:700;white-space:normal}
.btn.primary{background:var(--accentbg);border-color:#568ec0;color:#d8edff}.btn.slim{min-height:40px;padding:8px 11px;font-size:13px}
.btn.ghost{background:transparent;color:var(--dim)}.btn:active:not(:disabled){filter:brightness(1.16)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}
.navlabel{display:block;margin:15px 0 7px;color:var(--dim);font-size:12px;font-weight:800;letter-spacing:.025em;text-transform:uppercase}
.selectrow{display:grid;gap:6px}.selectrow.games{grid-template-columns:repeat(3,minmax(0,1fr))}.selectrow.rounds{grid-template-columns:repeat(2,minmax(0,1fr))}.selectrow.athletes{grid-template-columns:repeat(3,minmax(0,1fr))}
.selectrow button{min-width:0;min-height:52px;padding:8px 4px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--dim);font-size:14px;font-weight:700}
.selectrow button .sub{display:block;font-size:11px;color:var(--soft);font-weight:500;margin-top:2px}
.selectrow.athletes{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;box-shadow:0 6px 8px -8px #000}.selectrow button.selected{background:var(--accentbg);border-color:var(--accent);color:#ecf6ff}.selectrow button.selected .sub{color:#b6dcff}
.context{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin:14px 0 7px;padding:12px;border-radius:12px;background:#152b3c;border:1px solid #3b6586}.context strong{font-size:16px}.context .tag{padding:3px 7px;border-radius:6px;background:#274761;color:#cce8ff;font-size:12px;font-weight:700}
.rolebox{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px}.rolebox>strong{font-size:14px}.rolebuttons{display:flex;gap:6px}.rolebtn{min-width:80px;min-height:48px;border-radius:10px;background:var(--sub);border:1px solid var(--line);color:var(--dim);font-weight:800}.rolebtn.active.top{background:#16442c;border-color:#68be94;color:#d6ffe6}.rolebtn.active.bottom{background:#56401a;border-color:#d2a44e;color:#ffedb7}
.oppline{display:flex;gap:8px;align-items:center;margin:12px 0 2px}.oppline label{color:var(--dim);font-size:12px;min-width:66px}.oppline input{flex:1;min-width:0}
input,select,textarea{background:var(--sub);color:var(--text);border:1px solid var(--line);border-radius:9px;min-height:43px;padding:9px 11px;width:100%}input::placeholder,textarea::placeholder{color:#91a0ab}textarea{resize:vertical;min-height:69px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}
.panelhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.panelhead h2{font-size:17px;line-height:1.2;margin:0}.count{background:#35424e;color:#d3e0e8;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.help{color:var(--dim);font-size:12px;line-height:1.45;margin:0 0 11px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.actions.one{grid-template-columns:1fr}.actions.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.act{min-height:53px;padding:8px 6px;background:var(--sub);border:1px solid #566773;color:#f7fbff;border-radius:10px;font-weight:800;font-size:14px;line-height:1.15}.act.good{border-color:#407a61;background:#1a3c2e}.act.bad{border-color:#93645c;background:#46302f}.act.neutral{border-color:#6f8192;background:#2a3b4b}
.history-head{display:flex;justify-content:space-between;align-items:center;margin:11px 0 4px}.history-head strong{color:var(--dim);font-size:12px}.undo{background:transparent;border:1px solid var(--line);color:#dce8ef;border-radius:8px;min-height:38px;padding:7px 13px;font-size:13px;font-weight:800}
.history{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);max-height:185px;overflow-y:auto;overscroll-behavior:contain}
.history li{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid #34414c;padding:7px 1px;font-size:13px}.history .num{font-variant-numeric:tabular-nums;color:var(--soft);min-width:22px}.history .event{flex:1}.history .time{color:var(--soft);font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap}
.history .empty{color:var(--soft);padding:9px 2px;border:0;font-style:italic}.eventrole{color:var(--soft);font-size:11px;font-weight:500}
.notice{padding:13px;background:#2c332c;border:1px solid #57634d;color:#f0eacf;border-radius:12px;font-size:14px;line-height:1.5;margin:15px 0}
.sectiontoggle{width:100%;border:0;background:transparent;color:var(--text);font-weight:800;font-size:15px;text-align:left;padding:0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.formrows{display:grid;gap:10px;margin-top:12px}.formathlete{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sub)}.formathlete strong{display:block;font-size:13px;margin-bottom:7px}.forminputs{display:grid;grid-template-columns:1fr 1.2fr;gap:7px}.forminputs input,.forminputs select{background:var(--card)}
.details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:13px 0}.details summary{cursor:pointer;font-weight:800;font-size:14px;user-select:none}.details .body{padding-top:9px;color:var(--dim);font-size:13px;line-height:1.5}.details p{margin:5px 0 9px}.details strong{color:var(--text)}
.noteslabel{display:block;color:var(--dim);font-size:12px;font-weight:800;margin:14px 0 5px}
.exportbar{margin:20px 0 10px}.exportbar .actions{grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0}.preview{width:100%;height:220px;resize:vertical;white-space:pre;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#daeaf7}
.infonote{color:var(--soft);font-size:12px;line-height:1.5;margin-top:10px}
@media(max-width:360px){main{padding-left:9px;padding-right:9px}.selectrow button{font-size:12px}.context strong{font-size:14px}.rolebtn{min-width:70px}.actions.three{grid-template-columns:1fr 1fr}.actions.three .act:last-child{grid-column:span 2}}
</style>
</head>
<body>
<main id="app"><noscript>This clipboard requires JavaScript, but works offline.</noscript></main>
<script>
'use strict';
// Derived from the Project's CLA-CLIPBOARD-TEMPLATE.html. The canonical
// per-game tap arrays / 3-column export model are retained; the interface
// engine is explicitly extended for the attached mobile UI guidelines:
// one active focal athlete, six round contexts, manual role changes,
// stable identities, per-measure histories + Undo, and round-aware export.
// Every bottom win is recordable from either focal role (A1/A2: back/top/tap; B: standing).
// ---- session configuration --------------------------------------------
const SESSION={id:'pinning-s1-2026-11-11-banded-v2',title:'Pinning · Session 1',date:'11 Nov 2026'};
const BANDS=[{id:'developing',label:'Up to 3 years'},{id:'advanced',label:'Over 3 years / serious competitors'}];
const GAMES=[
 {id:'A1',tab:'1 · Open guard',short:'Unprompted baseline',top:'Pass the legs and hold for as long as possible. If guard returns, pass again. No win.',bottom:'Get chest to back, get on top, or submit P1.'},
 {id:'B',tab:'2 · Stand up',short:'Bottom standing target',top:'Pass the legs and hold for as long as possible. If guard returns, pass again. No win.',bottom:'Stand up.'},
 {id:'A2',tab:'3 · Open guard',short:'Unprompted return',top:'Pass the legs and hold for as long as possible. If guard returns, pass again. No win.',bottom:'Get chest to back, get on top, or submit P1.'}
];
const MEASURES=[
 {id:'stand',title:'Bottom attempts standing',help:'Record a genuine attempt to rise, or bottom reaching their feet. Standing is legal but unnamed in Games 1 and 3.',options:[{id:'try',label:'Attempt',tone:'neutral'},{id:'stood',label:'Stood',tone:'good'}]},
 {id:'top_ground',title:'Top becomes seated / supine',help:'Only a meaningful compromised relationship—not incidental mat contact. Forced / voluntary / unclear can go in the coach note.',options:[{id:'lost',label:'Top seated / supine',tone:'bad'}]},
 {id:'pass',title:'Pass and hold',help:'Pass = legs cleared with top control. Mark when guard returns, or if the pass was still held at the bell.',options:[{id:'passed',label:'Pass',tone:'good'},{id:'returned',label:'Guard returned',tone:'neutral'},{id:'bell',label:'Held at bell',tone:'good'}]},
 {id:'bottom_win',title:'Bottom winning outcomes',help:'Record whenever the person on BOTTOM wins, whether the focal athlete is top or bottom. A win triggers a role switch; change the role selector manually.',options:[{id:'back',label:'Chest to back',tone:'good'},{id:'top',label:'Got on top',tone:'good'},{id:'tap',label:'Submission',tone:'good'}]}
];
const SLOTS=3,ROUNDS=2,KEY='matclip:'+SESSION.id;
// ----------------------------------------------------------------------
function emptyRound(){return {opponent:'',role:null,roleHistory:[],events:[],note:''};}
function fresh(){const s={version:2,subjects:Array.from({length:SLOTS},()=>({name:'',band:''})),rounds:{}};for(const g of GAMES)for(let r=1;r<=ROUNDS;r++)s.rounds[g.id+'-'+r]=Array.from({length:SLOTS},emptyRound);return s;}
let data=fresh();
const ui={game:'A1',round:1,athlete:0,setupOpen:true,exportOpen:false,exportPreview:false,warning:'',saveLabel:'Not yet saved'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clean(v){return String(v??'').replace(/\t/g,' ').replace(/\r?\n/g,' / ');}
function game(){return GAMES.find(g=>g.id===ui.game);}
function roundCtx(gid=ui.game,r=ui.round,idx=ui.athlete){return data.rounds[gid+'-'+r][idx];}
function athlete(i=ui.athlete){return data.subjects[i];}
function athleteLabel(i){return (data.subjects[i].name||'Athlete '+(i+1)).trim();}
function bandLabel(v){return BANDS.find(x=>x.id===v)?.label||'Band not set';}
function clock(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));ui.warning='';ui.saveLabel='Saved locally · '+clock();}catch(e){ui.warning='Not saved in this browser. Export before closing or navigating away.';ui.saveLabel='Save failed';}updateSaveUI();}
function updateSaveUI(){const el=document.getElementById('save-status');if(el){el.textContent=ui.warning||ui.saveLabel;el.className='status'+(ui.warning?' error':'');}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed?.version===2&&Array.isArray(parsed.subjects)&&parsed.rounds){const next=fresh();next.subjects.forEach((a,i)=>{if(parsed.subjects[i]){a.name=String(parsed.subjects[i].name||'');a.band=String(parsed.subjects[i].band||'');}});for(const key of Object.keys(next.rounds)){const old=parsed.rounds[key];if(Array.isArray(old)){old.slice(0,SLOTS).forEach((o,i)=>{if(!o)return;next.rounds[key][i]={opponent:String(o.opponent||''),role:['top','bottom'].includes(o.role)?o.role:null,roleHistory:Array.isArray(o.roleHistory)?o.roleHistory:[],events:Array.isArray(o.events)?o.events:[],note:String(o.note||'')};});}}data=next;ui.saveLabel='Restored local draft';}}}catch(e){ui.warning='Could not read a previous local draft. Export any recoverable data before replacing this file.';}ui.setupOpen=!data.subjects.some(s=>s.name);render();}
function setContext(which,value){if(which==='game'&&GAMES.some(g=>g.id===value))ui.game=value;if(which==='round'&&[1,2].includes(Number(value)))ui.round=Number(value);if(which==='athlete'&&Number.isInteger(Number(value))&&Number(value)>=0&&Number(value)<SLOTS)ui.athlete=Number(value);ui.exportPreview=false;render();}
function setSubject(i,field,value){if(!data.subjects[i])return;if(field==='name')data.subjects[i].name=value;if(field==='band'&&['',...BANDS.map(b=>b.id)].includes(value))data.subjects[i].band=value;save();}
function setRoundText(field,value){if(!['opponent','note'].includes(field))return;roundCtx()[field]=value;save();}
function setRole(role){if(!['top','bottom'].includes(role))return;const ctx=roundCtx();if(ctx.role===role)return;ctx.role=role;ctx.roleHistory.push({role,time:clock()});save();render();}
function optionsFor(mid){
 const m=MEASURES.find(x=>x.id===mid);if(!m)return [];
 if(mid==='bottom_win'&&ui.game==='B')return [{id:'stood',label:'Stood · win',tone:'good'}];
 if(mid==='stand'&&ui.game==='B')return m.options.filter(o=>o.id==='try');
 return m.options;
}
function record(mid,vid){const ctx=roundCtx();if(!['top','bottom'].includes(ctx.role))return;const m=MEASURES.find(x=>x.id===mid);if(!m||!optionsFor(mid).some(o=>o.id===vid))return;ctx.events.push({measure:mid,value:vid,time:clock(),role:ctx.role});save();render();}
function undo(mid){const ctx=roundCtx();for(let i=ctx.events.length-1;i>=0;i--){if(ctx.events[i].measure===mid){ctx.events.splice(i,1);save();render();return;}}}
function labelEvent(mid,vid){if(mid==='bottom_win'&&vid==='stood')return 'Stood · win';return MEASURES.find(x=>x.id===mid)?.options.find(x=>x.id===vid)?.label||vid;}
function btnAct(mid,o){const ctx=roundCtx(),locked=!ctx.role;return `<button class="act ${o.tone||''}" onclick="record('${mid}','${o.id}')" ${locked?'disabled':''}>${esc(o.label)}</button>`;}
function panel(m){
 const ctx=roundCtx(),options=optionsFor(m.id),events=ctx.events.filter(e=>e.measure===m.id);
 const hist=events.length?events.map((e,i)=>{
  const outcome=m.id==='bottom_win'?(e.role==='top'?' · opponent won / focal lost':e.role==='bottom'?' · focal won':' · winner unclear'):'';
  return `<li><span class="num">${i+1}.</span><span class="event">${esc(labelEvent(m.id,e.value))}<span class="eventrole"> · focal ${esc(e.role==='bottom'?'BOTTOM':e.role==='top'?'TOP':'role unknown')}${esc(outcome)}</span></span><span class="time">${esc(e.time||'')}</span></li>`;
 }).join(''):`<li class="empty">Nothing recorded — blank is unknown, not zero.</li>`;
 let title=m.title,help=m.help;
 if(ctx.role==='bottom'){
  if(m.id==='stand'){title='Your standing attempts';help='Record attempts by the focal athlete to rise. '+(ui.game==='B'?'Record completed standing as a win in the bottom winning outcomes panel.':'Record standing as Stood; it is not a designated win in this game.');}
  if(m.id==='top_ground'){title='Opponent top becomes seated / supine';help='A meaningful compromised top relationship, whether forced by focal bottom or self-initiated by the opponent. Note the cause if clear.';}
  if(m.id==='pass'){title='Opponent pass / your guard recovery';help='Record when the opponent passes, when the focal athlete restores guard, or when the opponent holds the pass to the bell.';}
  if(m.id==='bottom_win')help='Record your win from bottom. Then select TOP after the pair switches roles. '+(ui.game==='B'?'Standing is the only bottom win in Game 2.':'The three bottom win outcomes are distinct.');
 }else if(ctx.role==='top'&&m.id==='bottom_win'){
  help='Record HOW your opponent on bottom beat you. Then select BOTTOM after the pair switches roles. '+(ui.game==='B'?'Standing is the only bottom win in Game 2.':'Chest to back, getting on top, and submission are separate outcomes.');
 }else if(m.id==='bottom_win'){
  help='Select the focal athlete’s current role. Then record wins by the person on BOTTOM; both roles are observable.';
 }
 if(m.id==='stand'&&ui.game==='B'&&ctx.role!=='bottom')help='Record attempts by bottom to get to standing. A completed stand is a win recorded in the bottom winning outcomes panel below.';
 return `<section class="panel" aria-label="${esc(title)}"><div class="panelhead"><h2>${esc(title)}</h2><span class="count">${events.length} recorded</span></div><p class="help">${esc(help)}</p><div class="actions ${options.length===1?'one':options.length===3?'three':''}">${options.map(o=>btnAct(m.id,o)).join('')}</div><div class="history-head"><strong>Recorded history</strong><button class="undo" ${events.length?'':'disabled'} onclick="undo('${m.id}')">Undo last</button></div><ol class="history">${hist}</ol></section>`;
}
function visibleMeasures(){return MEASURES;}
function render(){const g=game(),ctx=roundCtx(),name=athleteLabel(ui.athlete),band=bandLabel(athlete().band);const games=GAMES.map(x=>`<button class="${ui.game===x.id?'selected':''}" aria-pressed="${ui.game===x.id}" onclick="setContext('game','${x.id}')">${esc(x.id)}<span class="sub">${esc(x.short)}</span></button>`).join('');const roundBtns=[1,2].map(r=>`<button class="${ui.round===r?'selected':''}" aria-pressed="${ui.round===r}" onclick="setContext('round',${r})">Round ${r}<span class="sub">5 minutes</span></button>`).join('');const subjects=data.subjects.map((a,i)=>`<button class="${i===ui.athlete?'selected':''}" aria-pressed="${i===ui.athlete}" onclick="setContext('athlete',${i})">${esc((a.name||'Athlete '+(i+1)).slice(0,18))}<span class="sub">${esc((roundCtx(ui.game,ui.round,i).role||'role not set').toUpperCase())}</span></button>`).join('');const bandOptions=BANDS.map(b=>`<option value="${b.id}">${esc(b.label)}</option>`).join('');const setup=data.subjects.map((a,i)=>`<div class="formathlete"><strong>Focal athlete ${i+1}</strong><div class="forminputs"><input value="${esc(a.name)}" placeholder="Name" aria-label="Focal athlete ${i+1} name" oninput="setSubject(${i},'name',this.value)" onchange="render()"><select aria-label="Athlete ${i+1} band" onchange="setSubject(${i},'band',this.value);render()"><option value="" ${a.band?'':'selected'}>Choose band</option>${BANDS.map(b=>`<option value="${b.id}" ${a.band===b.id?'selected':''}>${esc(b.label)}</option>`).join('')}</select></div></div>`).join('');document.getElementById('app').innerHTML=`
<header><div><div class="eyebrow">Practice Design · Coaching clipboard</div><h1>${esc(SESSION.title)}</h1></div><button class="btn primary" onclick="toggleExport()">Export TSV</button></header>
<div class="topmeta"><span class="muted">${esc(SESSION.date)} · 3 games × 2 rounds × 5 min</span><span id="save-status" class="status">${esc(ui.saveLabel)}</span></div>
<section class="details" aria-label="Focal athlete setup"><button class="sectiontoggle" onclick="toggleSetup()">Set up three focal athletes &amp; bands <span aria-hidden="true">${ui.setupOpen?'▴':'▾'}</span></button>${ui.setupOpen?`<div class="formrows">${setup}</div><p class="infonote">Bands: up to 3 years; over 3 years / serious competitors. These identify observations only. No different game rules.</p>`:''}</section>
<span class="navlabel">Game</span><nav class="selectrow games" aria-label="Game">${games}</nav>
<span class="navlabel">Round</span><nav class="selectrow rounds" aria-label="Round">${roundBtns}</nav>
<span class="navlabel">Focal athlete</span><nav class="selectrow athletes" aria-label="Focal athlete">${subjects}</nav>
<div class="context" aria-label="Active recording context"><strong>${esc(g.id)} · Round ${ui.round} · ${esc(name)}</strong><span class="tag">${esc(ctx.role?ctx.role.toUpperCase():'ROLE NOT SET')}</span><span class="tag">${esc(band)}</span></div>
<div class="rolebox"><strong>Focal athlete is now:</strong><div class="rolebuttons"><button class="rolebtn ${ctx.role==='top'?'active top':''}" aria-pressed="${ctx.role==='top'}" onclick="setRole('top')">TOP</button><button class="rolebtn ${ctx.role==='bottom'?'active bottom':''}" aria-pressed="${ctx.role==='bottom'}" onclick="setRole('bottom')">BOTTOM</button></div></div>
<div class="oppline"><label for="opponent">Opponent</label><input id="opponent" value="${esc(ctx.opponent)}" placeholder="This game's round partner (optional)" oninput="setRoundText('opponent',this.value)"></div>
${!ctx.role?`<div class="notice">Select TOP or BOTTOM to record events. Change the role manually after a bottom win; the clipboard will not change it automatically.</div>`:''}
${visibleMeasures().map(panel).join('')}
<label class="noteslabel" for="note">Coach note · this athlete / game / round</label><textarea id="note" placeholder="Optional: forced vs self-initiated loss; meaningful opponent actions; uncertain events…" oninput="setRoundText('note',this.value)">${esc(ctx.note)}</textarea>
<details class="details"><summary>Game instructions &amp; reset rules</summary><div class="body"><p><strong>P1 (top):</strong> ${esc(g.top)}</p><p><strong>P2 (bottom):</strong> ${esc(g.bottom)}</p><p><strong>Roles:</strong> When bottom wins, the pair swaps top/bottom and restarts seated guard. Winning targets for Games 1 &amp; 3: chest to back, get on top, submit. Game 2: stand up. Only bottom's win triggers a role switch.</p><p><strong>Partners:</strong> Everyone changes partners after each 5-minute round on the coach's signal. Repeated passes are continuous play: pass, hold, pass again if guard returns. Top has no win.</p><p><strong>Coach only:</strong> Do not state the invariant to the room. Observation does not change anyone's rules.</p></div></details>
<section class="details exportbar" id="exportarea"><button class="sectiontoggle" onclick="toggleExport()">Export this session <span aria-hidden="true">${ui.exportOpen?'▴':'▾'}</span></button>${ui.exportOpen?`<p class="infonote">The TSV includes game, round, athlete, band, opponent, manual role history, each recorded observation (with focal role at the time), and all bottom wins in every game, including when the focal athlete was TOP. Blank means not observed, not zero. Export after class; browser storage is only a working draft.</p><div class="actions"><button class="btn primary" onclick="downloadTSV()">Download TSV</button><button class="btn" onclick="copyTSV()">Copy TSV</button></div><button class="btn slim ghost" onclick="togglePreview()">${ui.exportPreview?'Hide preview':'Show TSV preview'}</button>${ui.exportPreview?`<textarea class="preview" readonly aria-label="TSV export preview">${esc(tsv())}</textarea>`:''}<div class="small" id="copy-status" aria-live="polite"></div>`:''}</section>
<p class="infonote">Record observations while the focal athlete is TOP or BOTTOM. Each tap saves the athlete’s role at that moment. Use each measure’s Undo to remove its last event. After a bottom win, switch roles manually. Working data from this clipboard version remains in local storage; export after class.</p>`;updateSaveUI();}
function toggleSetup(){ui.setupOpen=!ui.setupOpen;render();}
function toggleExport(){ui.exportOpen=!ui.exportOpen;render();if(ui.exportOpen){const el=document.getElementById('exportarea');el?.scrollIntoView?.({block:'nearest',behavior:'smooth'});}}
function togglePreview(){ui.exportPreview=!ui.exportPreview;render();}
function observationText(ctx,id){return ctx.events.filter(e=>e.measure===id).map(e=>{const role=e.role==='bottom'?'focal-bottom':e.role==='top'?'focal-top':'role-unknown';const who=id==='bottom_win'?(e.role==='bottom'?' [winner=focal]':e.role==='top'?' [winner=opponent]':' [winner=unknown]'):'';return `${role}${who}: ${labelEvent(id,e.value)}@${e.time||'?'}`;}).join(' / ');}
function tsv(){const lines=['session_id\tgame\tround\tfocal_athlete\tband\topponent\trole_history\tbottom_standing\ttop_seated_supine\tpass_and_hold\tbottom_wins\tcoach_note'];for(const g of GAMES)for(let r=1;r<=ROUNDS;r++)for(let i=0;i<SLOTS;i++){const a=data.subjects[i],ctx=roundCtx(g.id,r,i);const has=ctx.events.length||ctx.roleHistory.length||ctx.note.trim()||ctx.opponent.trim();if(!has)continue;const row=[SESSION.id,g.id,String(r),a.name||`Athlete ${i+1}`,bandLabel(a.band),ctx.opponent,ctx.roleHistory.map(h=>`${h.role}@${h.time||'?'}`).join(' / '),observationText(ctx,'stand'),observationText(ctx,'top_ground'),observationText(ctx,'pass'),observationText(ctx,'bottom_win'),ctx.note];lines.push(row.map(clean).join('\t'));}return lines.join('\n');}
function filename(){return SESSION.id+'.tsv';}
function downloadTSV(){try{const blob=new Blob([tsv()+'\n'],{type:'text/tab-separated-values;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename();a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);const el=document.getElementById('copy-status');if(el)el.textContent='TSV download requested. Verify the saved file before closing.';}catch(e){const el=document.getElementById('copy-status');if(el)el.textContent='Download failed. Use Copy TSV or preview instead.';}}
async function copyTSV(){const content=tsv();try{if(!navigator.clipboard?.writeText)throw Error('Clipboard API unavailable');await navigator.clipboard.writeText(content);const el=document.getElementById('copy-status');if(el)el.textContent='TSV copied.';}catch(e){ui.exportPreview=true;render();const ta=document.querySelector('.preview');if(ta){ta.focus();ta.select();try{document.execCommand('copy');const el=document.getElementById('copy-status');if(el)el.textContent='TSV selected/copied. Paste to verify.';}catch(x){const el=document.getElementById('copy-status');if(el)el.textContent='Use the selected preview to copy manually.';}}}}
load();
</script>
</body>
</html>
